<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ब्रिज पिकर</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            margin: 15px auto;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button {
            background-color: #ff9800;
            color: #000;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        button:hover { background-color: #e68900; }
        img, video {
            max-width: 100%;
            height: auto;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <h2>इमेज और वीडियो पिकर (ब्रिज मेथड)</h2>

    <!-- फोटो चुनने का बटन -->
    <div class="card">
        <h3>तस्वीर चुनें (Image)</h3>
        <button onclick="openImageGallery()">गैलरी खोलें (फोटो)</button>
        <img id="imagePreview" alt="Image Preview">
    </div>

    <!-- वीडियो चुनने का बटन -->
    <div class="card">
        <h3>वीडियो चुनें (Video)</h3>
        <button onclick="openVideoGallery()">गैलरी खोलें (वीडियो)</button>
        <video id="videoPreview" controls></video>
    </div>

    <script>
        // जब फोटो बटन दबेगा, यह ऐप इन्वेंटर को सिग्नल भेजेगा
        function openImageGallery() {
            window.location.href = "action:pickImage";
        }

        // जब वीडियो बटन दबेगा, यह ऐप इन्वेंटर को सिग्नल भेजेगा
        function openVideoGallery() {
            window.location.href = "action:pickVideo";
        }

        // ऐप इन्वेंटर इस फंक्शन को कॉल करके फाइल का पाथ यहाँ भेजेगा
        function showMedia(fileUri, type) {
            if (type === 'image') {
                const img = document.getElementById('imagePreview');
                img.src = fileUri;
                img.style.display = 'block';
            } else if (type === 'video') {
                const video = document.getElementById('videoPreview');
                video.src = fileUri;
                video.style.display = 'block';
            }
        }
    </script>

</body>
</html>
