<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>इमेज और वीडियो पिकर</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            margin: 15px auto;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h3 {
            margin-bottom: 10px;
            font-size: 18px;
            color: #ff9800;
        }
        input[type="file"] {
            background-color: #333;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            border: none;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
        }
        img, video {
            max-width: 100%;
            height: auto;
            margin-top: 15px;
            border-radius: 8px;
            display: none; /* जब तक फाइल न चुनी जाए, छुपा रहेगा */
        }
    </style>
</head>
<body>

    <h2>इमेज और वीडियो पिकर</h2>

    <!-- इमेज चुनने का सेक्शन -->
    <div class="card">
        <h3>तस्वीर चुनें (Image)</h3>
        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
        <br>
        <img id="imagePreview" alt="Image Preview">
    </div>

    <!-- वीडियो चुनने का सेक्शन -->
    <div class="card">
        <h3>वीडियो चुनें (Video)</h3>
        <input type="file" id="videoInput" accept="video/*" onchange="previewVideo(event)">
        <br>
        <video id="videoPreview" controls></video>
    </div>

    <script>
        // फोटो को स्क्रीन पर दिखाने का फंक्शन
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const img = document.getElementById('imagePreview');
                img.src = URL.createObjectURL(file);
                img.style.display = 'block';
            }
        }

        // वीडियो को स्क्रीन पर चलाने का फंक्शन
        function previewVideo(event) {
            const file = event.target.files[0];
            if (file) {
                const video = document.getElementById('videoPreview');
                video.src = URL.createObjectURL(file);
                video.style.display = 'block';
            }
        }
    </script>

</body>
</html>
