<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We Are Group - Admin Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- 📌 Agora Web SDK (Stable CDN Version) -->
  <script src="https://download.agora.io/sdk/web/AgoraRTC_N-4.18.0.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #121212; color: #ffffff; padding: 15px; display: flex; justify-content: center; }
    .admin-container { width: 100%; max-width: 500px; }
    .card { background: #1e1e1e; border: 1px solid #333; border-radius: 16px; padding: 18px; margin-bottom: 20px; }
    h2, h3 { color: #22c55e; margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 5px; font-weight: 600; }
    .input-field { width: 100%; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; padding: 10px 14px; color: #fff; outline: none; font-size: 0.9rem; }
    .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #22c55e; color: #000; font-weight: 800; font-size: 0.95rem; cursor: pointer; margin-top: 5px; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-secondary { background: #3b82f6; color: #fff; }
    #video-preview { width: 100%; height: 240px; background: #000; border-radius: 12px; margin-top: 10px; position: relative; overflow: hidden; }
    #camera-controls { display: none; gap: 10px; margin-top: 10px; }
    #upload-progress { display: none; color: #eab308; font-size: 0.85rem; margin-top: 5px; font-weight: 700; }
  </style>
</head>
<body>

<div class="admin-container">
  <h2 style="text-align:center; margin-bottom: 15px;">⚙️ Admin Control Panel</h2>

  <!-- 1. LIVE STREAMING CONTROLS (AGORA) -->
  <div class="card">
    <h3>🔴 Agora Live Streaming Control</h3>
    <p style="font-size:0.8rem; color:#aaa; margin-bottom:10px;">एक क्लिक में लाइव शुरू करें।</p>
    
    <div id="video-preview"></div>

    <button id="btn-start-live" class="btn" onclick="startLiveStream()"><i class="fa-solid fa-broadcast-tower"></i> Start Live Stream</button>
    <button id="btn-stop-live" class="btn btn-danger" style="display:none;" onclick="stopLiveStream()"><i class="fa-solid fa-power-off"></i> End Live Stream</button>

    <div id="camera-controls">
      <button class="btn btn-secondary" onclick="switchCamera()"><i class="fa-solid fa-camera-rotate"></i> Switch Camera</button>
    </div>
  </div>

  <!-- 2. CLOUDINARY VIDEO UPLOAD -->
  <div class="card">
    <h3>📹 Upload Video (Cloudinary)</h3>
    <div class="form-group">
      <label>Video Title</label>
      <input type="text" id="video-title" class="input-field" placeholder="Enter video title...">
    </div>
    <div class="form-group">
      <label>Select Video File from Phone</label>
      <input type="file" id="video-file-input" class="input-field" accept="video/*">
    </div>
    <div id="upload-progress">Uploading to Cloudinary... Please wait...</div>
    <button class="btn" onclick="uploadVideoToCloudinary()"><i class="fa-solid fa-cloud-arrow-up"></i> Upload & Publish Video</button>
  </div>

  <!-- 3. POST NORMAL QUESTION -->
  <div class="card">
    <h3>❓ Post Single Question</h3>
    <div class="form-group"><label>Question</label><input type="text" id="admin-q-text" class="input-field" placeholder="Enter question..."></div>
    <div class="form-group"><label>Option A</label><input type="text" id="admin-q-o0" class="input-field" placeholder="Option A"></div>
    <div class="form-group"><label>Option B</label><input type="text" id="admin-q-o1" class="input-field" placeholder="Option B"></div>
    <div class="form-group"><label>Option C</label><input type="text" id="admin-q-o2" class="input-field" placeholder="Option C"></div>
    <div class="form-group"><label>Option D</label><input type="text" id="admin-q-o3" class="input-field" placeholder="Option D"></div>
    <div class="form-group">
      <label>Correct Option Index (0 = A, 1 = B, 2 = C, 3 = D)</label>
      <select id="admin-q-ans" class="input-field">
        <option value="0">Option A</option>
        <option value="1">Option B</option>
        <option value="2">Option C</option>
        <option value="3">Option D</option>
      </select>
    </div>
    <button class="btn" onclick="postNormalQuestion()"><i class="fa-solid fa-paper-plane"></i> Publish Question</button>
  </div>

  <!-- 4. POST MORE QUESTIONS (HTML BULK PAPER) -->
  <div class="card">
    <h3>📄 Post More Qs (HTML Set)</h3>
    <div class="form-group"><label>Paper Set Title</label><input type="text" id="admin-paper-title" class="input-field" placeholder="e.g. Math Quiz Set 1"></div>
    <div class="form-group">
      <label>Paste HTML Code</label>
      <textarea id="admin-paper-html" class="input-field" rows="5" placeholder="Paste HTML code..."></textarea>
    </div>
    <button class="btn" onclick="postMorePaperSet()"><i class="fa-solid fa-file-code"></i> Publish Paper Set</button>
  </div>
</div>

<script>
  const BACKEND_URL = "https://mrankesh-live-backend.onrender.com";
  const FIREBASE_URL = "https://live-app-bdba9-default-rtdb.firebaseio.com";
  const AGORA_APP_ID = "edea8d3f66104552ac7ec969d670186d";
  const CLOUD_NAME = "vljvpsmy";
  const UPLOAD_PRESET = "we_are_group_preset";

  let agoraClient = null;
  let localTracks = { videoTrack: null, audioTrack: null };
  let currentCameraFacing = 'user';

  // 1. 🔴 LIVE STREAMING LOGIC
  async function startLiveStream() {
    if (typeof AgoraRTC === 'undefined') {
      alert("Agora SDK लोड नहीं हो पाया है। कृपया इंटरनेट चेक करें या क्रोम ब्राउज़र में खोलें।");
      return;
    }

    try {
      agoraClient = AgoraRTC.createClient({ mode: "live", codec: "vp8" });
      await agoraClient.setClientRole("host");

      const channelName = "main_channel";
      await agoraClient.join(AGORA_APP_ID, channelName, null, "admin_host");

      localTracks.audioTrack = await AgoraRTC.createMicrophoneAudioTrack();
      localTracks.videoTrack = await AgoraRTC.createCameraVideoTrack({
        encoderConfig: "360p_1",
        facingMode: currentCameraFacing
      });

      localTracks.videoTrack.play("video-preview");
      await agoraClient.publish([localTracks.audioTrack, localTracks.videoTrack]);

      await fetch(`${BACKEND_URL}/start-live`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ channelName: channelName, hostName: "Admin" })
      });

      document.getElementById('btn-start-live').style.display = 'none';
      document.getElementById('btn-stop-live').style.display = 'block';
      document.getElementById('camera-controls').style.display = 'flex';

      alert("🔴 Live Stream Started Successfully!");
    } catch (err) {
      alert("Live Error: " + err.message);
    }
  }

  async function stopLiveStream() {
    try {
      if (localTracks.videoTrack) { localTracks.videoTrack.stop(); localTracks.videoTrack.close(); }
      if (localTracks.audioTrack) { localTracks.audioTrack.stop(); localTracks.audioTrack.close(); }
      if (agoraClient) await agoraClient.leave();

      await fetch(`${BACKEND_URL}/end-live`, { method: 'POST' });

      document.getElementById('btn-start-live').style.display = 'block';
      document.getElementById('btn-stop-live').style.display = 'none';
      document.getElementById('camera-controls').style.display = 'none';
      alert("Live Stream Ended!");
    } catch (err) {
      alert("Error stopping stream: " + err.message);
    }
  }

  async function switchCamera() {
    if (!localTracks.videoTrack) return;
    try {
      currentCameraFacing = (currentCameraFacing === 'user') ? 'environment' : 'user';
      await localTracks.videoTrack.setDevice(currentCameraFacing);
    } catch (e) {
      alert("Camera switch error.");
    }
  }

  // 2. 📹 CLOUDINARY VIDEO UPLOAD (Fixed with error details)
  async function uploadVideoToCloudinary() {
    const title = document.getElementById('video-title').value.trim();
    const fileInput = document.getElementById('video-file-input');

    if (!title || fileInput.files.length === 0) {
      alert("Please enter Video Title and select a file!");
      return;
    }

    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", UPLOAD_PRESET);

    const progressDiv = document.getElementById('upload-progress');
    progressDiv.style.display = 'block';
    progressDiv.innerText = "Uploading to Cloudinary... Please wait...";

    try {
      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
        method: 'POST',
        body: formData
      });
      
      const data = await response.json();

      if (data.secure_url) {
        const videoData = {
          type: "video",
          title: title,
          url: data.secure_url,
          thumbnail: data.secure_url.replace(/\.[^/.]+$/, ".jpg"),
          createdAt: Date.now()
        };

        await fetch(`${FIREBASE_URL}/contents.json`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(videoData)
        });

        alert("📹 Video Uploaded & Published Successfully!");
        document.getElementById('video-title').value = '';
        fileInput.value = '';
      } else {
        alert("Upload Failed: " + (data.error ? data.error.message : "Unknown error"));
      }
    } catch (err) {
      alert("Network or Upload Error: " + err.message);
    } finally {
      progressDiv.style.display = 'none';
    }
  }

  // 3. ❓ POST NORMAL QUESTION
  async function postNormalQuestion() {
    const qText = document.getElementById('admin-q-text').value.trim();
    const o0 = document.getElementById('admin-q-o0').value.trim();
    const o1 = document.getElementById('admin-q-o1').value.trim();
    const o2 = document.getElementById('admin-q-o2').value.trim();
    const o3 = document.getElementById('admin-q-o3').value.trim();
    const ans = parseInt(document.getElementById('admin-q-ans').value);

    if (!qText || !o0 || !o1) { alert("Please fill Question and Options!"); return; }

    let res = await fetch(`${FIREBASE_URL}/NormQuizzes.json`);
    let list = await res.json() || [];
    if (!Array.isArray(list)) list = Object.values(list);

    list.push({ id: 'nq_' + Date.now(), creatorId: 'admin', question: qText, options: [o0, o1, o2, o3].filter(o => o !== ''), correctIndex: ans, responses: {} });
    await fetch(`${FIREBASE_URL}/NormQuizzes.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(list) });

    alert("Question Published!");
    document.getElementById('admin-q-text').value = '';
    document.getElementById('admin-q-o0').value = ''; document.getElementById('admin-q-o1').value = '';
    document.getElementById('admin-q-o2').value = ''; document.getElementById('admin-q-o3').value = '';
  }

  // 4. 📄 POST MORE PAPERS (HTML SET)
  async function postMorePaperSet() {
    const title = document.getElementById('admin-paper-title').value.trim();
    const htmlText = document.getElementById('admin-paper-html').value.trim();
    if (!title || !htmlText) { alert("Please enter Title and HTML Code!"); return; }

    let tempDiv = document.createElement('div');
    tempDiv.innerHTML = htmlText;
    let qNodes = tempDiv.querySelectorAll('.paper-q-item');
    let extractedQuestions = [];

    qNodes.forEach((node, idx) => {
      extractedQuestions.push({
        qId: 'p_q_' + Date.now() + '_' + idx,
        qText: node.getAttribute('data-q') || `Question ${idx + 1}`,
        options: [node.getAttribute('data-o0') || 'A', node.getAttribute('data-o1') || 'B', node.getAttribute('data-o2') || 'C', node.getAttribute('data-o3') || 'D'],
        correctIndex: parseInt(node.getAttribute('data-ans') || '0')
      });
    });

    if (extractedQuestions.length === 0) { alert("Invalid HTML Code format!"); return; }

    let res = await fetch(`${FIREBASE_URL}/MorePapers.json`);
    let list = await res.json() || [];
    if (!Array.isArray(list)) list = Object.values(list);

    list.push({ id: 'mp_' + Date.now(), creatorId: 'admin', title, questions: extractedQuestions, responses: {} });
    await fetch(`${FIREBASE_URL}/MorePapers.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(list) });

    alert("Paper Set Published!");
    document.getElementById('admin-paper-title').value = '';
    document.getElementById('admin-paper-html').value = '';
  }
</script>

</body>
</html>
