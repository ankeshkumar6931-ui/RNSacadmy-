
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agora Video Call Test</title>
    <!-- Agora Web SDK CDN -->
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: #121212; 
            color: #ffffff;
        }
        #buttons-container { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 10px; 
        }
        button { 
            padding: 10px 15px; 
            font-size: 16px; 
            cursor: pointer; 
            border: none;
            border-radius: 5px;
            background: #4CAF50;
            color: white;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #leave-btn {
            background: #f44336;
        }
        #video-container { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        .player { 
            width: 100%; 
            height: 220px; 
            background: #000; 
            border-radius: 8px; 
            position: relative; 
            overflow: hidden;
        }
        .player-name { 
            position: absolute; 
            bottom: 10px; 
            left: 10px; 
            color: #fff; 
            background: rgba(0,0,0,0.6); 
            padding: 3px 8px; 
            border-radius: 4px; 
            font-size: 12px; 
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="buttons-container">
        <button id="join-btn">Join Call</button>
        <button id="leave-btn" disabled>Leave Call</button>
    </div>

    <div id="video-container">
        <div id="local-player" class="player">
            <div class="player-name">Local (You)</div>
        </div>
        <div id="remote-player" class="player">
            <div class="player-name">Remote User</div>
        </div>
    </div>

    <script>
        // आपकी Agora App ID यहाँ सेट है
        const APP_ID = "edea8d3f66104552ac7ec969d670186d";
        const CHANNEL = "test-channel-123"; // दोनों फोन पर चैनल का नाम एक जैसा होना चाहिए
        const TOKEN = null; // अगर Agora Console में App Certificate 'Testing mode' में है, तो null काम करेगा।

        const client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });

        let localTracks = {
            videoTrack: null,
            audioTrack: null
        };

        // Join Call Button Click
        document.getElementById("join-btn").onclick = async () => {
            try {
                // 1. चैनल से जुड़ें
                await client.join(APP_ID, CHANNEL, TOKEN, null);
                
                // 2. कैमरा और माइक एक्सेस करें
                localTracks.audioTrack = await AgoraRTC.createMicrophoneAudioTrack();
                localTracks.videoTrack = await AgoraRTC.createCameraVideoTrack();

                // 3. अपना वीडियो लोकल स्क्रीन पर दिखाएं
                localTracks.videoTrack.play("local-player");
                
                // 4. अपनी स्ट्रीम चैनल पर पब्लिश करें ताकि दूसरा यूजर देख सके
                await client.publish([localTracks.audioTrack, localTracks.videoTrack]);
                
                document.getElementById("join-btn").disabled = true;
                document.getElementById("leave-btn").disabled = false;
                console.log("Successfully joined the channel!");
            } catch (error) {
                console.error("Error joining call:", error);
                alert("Error: " + error.message);
            }
        };

        // जब कोई दूसरा यूजर चैनल से जुड़े
        client.on("user-published", async (user, mediaType) => {
            await client.subscribe(user, mediaType);
            if (mediaType === "video") {
                const remotePlayerContainer = document.getElementById("remote-player");
                user.videoTrack.play(remotePlayerContainer);
            }
            if (mediaType === "audio") {
                user.audioTrack.play();
            }
        });

        // जब दूसरा यूजर वीडियो बंद कर दे
        client.on("user-unpublished", (user, mediaType) => {
            if (mediaType === "video") {
                document.getElementById("remote-player").innerHTML = '<div class="player-name">Remote User</div>';
            }
        });

        // Leave Call Button Click
        document.getElementById("leave-btn").onclick = async () => {
            for (let track of Object.values(localTracks)) {
                if (track) {
                    track.stop();
                    track.close();
                }
            }
            await client.leave();
            
            document.getElementById("local-player").innerHTML = '<div class="player-name">Local (You)</div>';
            document.getElementById("remote-player").innerHTML = '<div class="player-name">Remote User</div>';
            
            document.getElementById("join-btn").disabled = false;
            document.getElementById("leave-btn").disabled = true;
            console.log("Left the call successfully.");
        };
    </script>
</body>
</html>
